name: Build deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 \
                -isysroot "$SDK" \
                -dynamiclib -fobjc-arc \
                -Wno-deprecated-declarations \
                -install_name @executable_path/Frameworks/FullScreenBackTweak.dylib \
                -framework UIKit \
                -framework Foundation \
                -framework AVFoundation \
                -o FullScreenBackTweak.dylib \
                FullScreenBackTweak.x
          ls -la FullScreenBackTweak.dylib
      - name: Package deb manually
        run: |
          # 创建目录结构
          mkdir -p pkg/DEBIAN
          mkdir -p pkg/Library/MobileSubstrate/DynamicLibraries
          
          # control文件
          printf "Package: com.fullscreenback.tweak\nName: FullScreenBackTweak\nVersion: 1.0.0\nArchitecture: iphoneos-arm64\nDescription: Full Screen Back Tweak\nMaintainer: custom\nAuthor: custom\nSection: Tweaks\nDepends: firmware (>= 15.0)\nPriority: optional\n" > pkg/DEBIAN/control
          
          # 复制文件
          cp FullScreenBackTweak.dylib pkg/Library/MobileSubstrate/DynamicLibraries/
          cp FullScreenBackTweak.plist pkg/Library/MobileSubstrate/DynamicLibraries/
          
          # 打包
          cd pkg
          tar czf control.tar.gz DEBIAN
          tar czf data.tar.gz Library
          echo "2.0" > debian-binary
          ar r FullScreenBackTweak.deb debian-binary control.tar.gz data.tar.gz
          mv FullScreenBackTweak.deb ../
          cd ..
          ls -la FullScreenBackTweak.deb
      - uses: actions/upload-artifact@v4
        with:
          name: FullScreenBackTweak.deb
          path: FullScreenBackTweak.deb